name: Build sandbox image

# The code-execution (BETA) sandbox image — pulled at runtime by the
# microsandbox SDK (MSB_IMAGE), not by Docker. Rebuilt only when its
# Dockerfile changes, or on demand with an explicit version tag.
on:
  push:
    branches: [main]
    paths: ['deploy/sandbox/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1) — MSB_IMAGE pins this'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perguntai-sandbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
