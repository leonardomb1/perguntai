apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "perguntai.fullname" . }}-config
  labels: {{- include "perguntai.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if not .Values.secret.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "perguntai.fullname" . }}
  labels: {{- include "perguntai.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Inline secrets (dev only). In production set secret.existingSecret and
  # manage these with External Secrets Operator / sealed-secrets instead.
  # Expected keys: JWT_SECRET, ANTHROPIC_FOUNDRY_API_KEY, WINDMILL_AUTH_TOKEN,
  # STARROCKS_SYNC_USER, STARROCKS_SYNC_PASSWORD, DATABASE_URL,
  # AZURE_BLOB_CONNECTION_STRING, SENTRY_DSN
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
