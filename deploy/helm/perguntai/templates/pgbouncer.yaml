{{- if .Values.pgbouncer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "perguntai.fullname" . }}-pgbouncer
  labels: {{- include "perguntai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pgbouncer.replicaCount }}
  selector:
    matchLabels:
      {{- include "perguntai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        {{- include "perguntai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image }}
          ports:
            - name: pgbouncer
              containerPort: 6432
          env:
            - name: DB_HOST
              value: {{ .Values.pgbouncer.upstream.host | quote }}
            - name: DB_PORT
              value: {{ .Values.pgbouncer.upstream.port | quote }}
            - name: DB_NAME
              value: {{ .Values.pgbouncer.upstream.dbname | quote }}
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "perguntai.secretName" . }}
                  key: {{ .Values.pgbouncer.authSecretUserKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "perguntai.secretName" . }}
                  key: {{ .Values.pgbouncer.authSecretPassKey }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perguntai.fullname" . }}-pgbouncer
  labels: {{- include "perguntai.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "perguntai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: pgbouncer
{{- end }}
