services:
  perguntai:
    # CI-built image (private — `docker login ghcr.io` with a read:packages PAT).
    # `docker compose build` still works for local builds; deploys should
    # `docker compose pull && docker compose up -d`.
    image: ghcr.io/your-org/perguntai:latest
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    volumes:
      # all app state (conversations, documents, exports, schema.json) — named
      # volume, NOT a host bind: bind mounts inherit host ownership (root on
      # most servers) and break the non-root container user's writes.
      - perguntai-data:/app/data
      # Code execution (BETA): the microsandbox OCI-image cache (~1.2 GB once
      # pulled). Persisting it keeps user runs at warm-boot speed (~300ms)
      # across container restarts; without it every restart re-pulls (~70s,
      # absorbed by the warm-up, never by a user).
      - msbcache:/home/node/.microsandbox
    # Code execution (BETA): microsandbox boots KVM microVMs, so the container
    # needs the host's /dev/kvm. The container user is uid 1000 (node) — grant
    # it on the host with an ACL (setfacl -m u:1000:rw /dev/kvm) or add the
    # host's kvm gid via group_add. Remove this line on hosts without KVM; the
    # capability toggle in /organization → Capacidades then stays off.
    devices:
      - /dev/kvm
    restart: unless-stopped

  # Schema sync runs at runtime instead of a sidecar: an external cron POSTs
  # to /api/admin/sync-schema with
  # `Authorization: Bearer $SCHEMA_SYNC_TOKEN`. It uses the STARROCKS_SYNC_*
  # service account and writes schema.json into the volume (picked up by mtime).
  # For a local one-off: node scripts/sync-schema.js (see scripts/sync-schema.js).

volumes:
  perguntai-data:
  msbcache:
